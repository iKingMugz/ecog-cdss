}

/* logo */
.logo {

      #bde9ff,
      #ffc8ea,
      #d8c6ff,
      #ffffff
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* search */
.search-box {
  padding: 8px 12px;

  background: rgba(255,255,255,.05);

  color: white;

  outline: none;
}

.search-box::placeholder {

}

/* category buttons */
.categories {
  text-align: center;
  margin: 18px;
}

.categories button {

  margin: 6px;
  padding: 10px 15px;

  border-radius: 12px;

  border: 1px solid rgba(255,255,255,.12);

  cursor: pointer;

  font-weight: bold;

  color: white;

  background: linear-gradient(
      135deg,
      #b8e9ff,
      #ffc4e6
  );

  transition: .25s;
}

.categories button:hover {

  transform: translateY(-2px) scale(1.05);

  background: linear-gradient(
      135deg,
      #e8f9ff,
      #ffd8ef
  );

  box-shadow:
      0 0 18px rgba(190,235,255,.45),
      0 0 18px rgba(255,190,225,.25);
}

/* grid */
.flex-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 22px;
  padding: 25px;
}

/* links */
.game-link {
  text-decoration: none;
}

/* game tile */
.game-tile {

  width: 190px;
  padding: 10px;

  text-align: center;

  background: rgba(255,255,255,.06);

  border: 1px solid rgba(220,240,255,.15);

  border-radius: 16px;

  backdrop-filter: blur(10px);

  transition: .25s ease;

  position: relative;
  overflow: hidden;
}

/* opal shimmer */
.game-tile::before {

  content: "";

  position: absolute;

  top: -50%;
  left: -50%;

  width: 200%;
  height: 200%;

  background:
      radial-gradient(circle,
      rgba(190,235,255,.18),
      rgba(255,205,235,.12),
      transparent 70%);

  transform: rotate(25deg);

  opacity: 0;

  transition: .3s;
}

.game-tile:hover::before {
  opacity: 1;
}

.game-tile:hover {

  transform: translateY(-6px) scale(1.05);

  border-color: rgba(190,235,255,.35);

  box-shadow:
      0 0 25px rgba(180,225,255,.18),
      0 0 35px rgba(255,195,230,.15);
}

/* images */
.game-icon {

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: fill;

  border-radius: 12px;

  border: 2px solid rgba(255,255,255,.1);

  transition: .25s;
}

.game-tile:hover .game-icon {
  border-color: rgba(255,255,255,.35);
}

/* title */
.game-title {

  margin-top: 10px;

  font-size: 14px;

  font-weight: 600;

  color: #f6fbff;
}

/* popular */

.popular {

  border: 1px solid #ffc8ea;

  box-shadow:
      0 0 20px rgba(255,200,234,.35);
}

</style>
</head>

<script>

/* ===== SEARCH ===== */
document.getElementById("search").addEventListener("keyup", function() {
  let filter = this.value.toLowerCase();
  let games = document.querySelectorAll(".game-link");

  games.forEach(game => {
    let title = game.innerText.toLowerCase();
    game.style.display = title.includes(filter) ? "block" : "none";
  });
});

/* ===== CATEGORY FILTER ===== */
function filterGames(category) {
  let games = document.querySelectorAll(".game-link");

  games.forEach(game => {
    if (category === "all") {
      game.style.display = "block";
    } else {
      let cats = game.getAttribute("data-category");
      game.style.display = cats.includes(category) ? "block" : "none";
    }
  });
}

</script>
