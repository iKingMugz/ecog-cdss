<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POG Sites</title>

<style>


body{
    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at top,#2b183d 0%,#17253b 35%,#090910 100%);

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}



.container{

    position:relative;

    width:90%;
    max-width:960px;

    text-align:center;

    padding:60px;

    overflow:hidden;

    border-radius:28px;

    background:rgba(24,26,40,.82);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 0 40px rgba(180,140,255,.12),
        0 0 50px rgba(180,225,255,.08),
        0 0 60px rgba(120,255,180,.08);
}


.title{

    font-size:3.5rem;

    font-weight:400;

    margin-bottom:22px;



    background-size:300%;

    -webkit-background-clip:text;

}




.subtitle{

    font-size:1.2rem;

    line-height:1.8;

    color:#e7ebff;

    max-width:800px;

    margin:auto;

    margin-bottom:50px;
}



.button-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:22px;
}

.ecog-button{

    text-decoration:none;

    color:white;

    padding:22px;

    border-radius:18px;


    background:linear-gradient(
        135deg,
        rgba(170, 255, 173, 0.65),
        rgba(185, 255, 197, 0.65)
    );

    box-shadow:
        0 8px 20px rgba(180,180,255,.15);
}

.ecog-button:hover{

    transform:translateY(-6px) scale(1.05);

    background:linear-gradient(
        135deg,
        rgba(211, 255, 205, 0.85),
        rgba(170,255,195,.80)
    );

    box-shadow:
        0 0 24px rgba(220, 255, 222, 0.2),
        0 0 28px rgba(153, 255, 150, 0.15);
}

.ecog-button span{

    display:block;

    margin-top:8px;

    font-size:.92rem;

    opacity:.82;
}




.footer{

    margin-top:40px;

    color:#c9d8f0;

    font-size:.9rem;

    opacity:.8;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        POG SITES
    </div>

    <div class="subtitle">
        Welcome to POG Sites! The ultimate website for over
        <b>400 Flash games</b>, and over
        <b>200 other games</b>!
        Including basic web games, emulator games,
        AI games, and other cool projects created by our devs!
    </div>

    <div class="button-grid">

        <a href="uhed.html" class="ecog-button extra-button">
             Games
        </a>

        <a href="otherfiles.html" class="ecog-button extra-button">
            Extra Files
        </a>
        
    <a href="music.html" class="ecog-button extra-button">
            Video Game Soundtracks
        </a>
        

    </div>

    <div class="footer">
        POG Sites • By iKingMugz
    </div>

   <div class="footer">
       Join the 
      <a href="https://docs.google.com/document/d/1qLyKvXo3Ed605YzdAWZjtgIXsbjtD3BDLIWozPZMRU4/" target="_blank" class="flash-link">Discord!</a> 
    </div>
   
</div>

</body>
</html>
